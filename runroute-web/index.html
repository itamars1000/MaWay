<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4A5A6B" />

    <!-- Accessibility preferences: apply saved classes before first paint to
         avoid a flash of unstyled prefs. Mirrors CLASS_RULES in
         src/lib/a11yPrefs.js — keep the two in sync. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('maway:a11y:v1');
          if (!raw) return;
          var p = JSON.parse(raw);
          if (!p || p.version !== 1) return;
          var c = document.documentElement.classList;
          c.toggle('a11y-links', !!p.links);
          c.toggle('a11y-contrast-high', p.contrast === 'high');
          c.toggle('a11y-contrast-invert', p.contrast === 'invert');
          c.toggle('a11y-text-115', p.textSize === 115);
          c.toggle('a11y-text-130', p.textSize === 130);
          c.toggle('a11y-text-150', p.textSize === 150);
          c.toggle('a11y-lines-16', p.lineSpacing === 160);
          c.toggle('a11y-lines-20', p.lineSpacing === 200);
          c.toggle('a11y-reduce-motion', !!p.reduceMotion);
        } catch (e) {}
      })();
    </script>

    <!-- Icons / PWA. The web manifest + service-worker registration are injected
         by vite-plugin-pwa; these tags cover the bits iOS Safari needs itself. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MaWay" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>MaWay — מצא את הדרך שלך</title>
    <meta name="description" content="מסלולי ריצה מעגליים שמעדיפים רחובות ישרים ורציפים — נוצרים אוטומטית סביב המיקום שלך." />

    <!-- Open Graph / Twitter Card: the preview shown when this link is shared
         (WhatsApp, etc). og:image must be an absolute URL. Regenerate the image
         with `npm run gen:og` after changing the logo or brand colors. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ma-way.vercel.app/" />
    <meta property="og:site_name" content="MaWay" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="MaWay — מצא את הדרך שלך" />
    <meta property="og:description" content="מסלולי ריצה ישרים ורציפים — שמירה וסנכרון בין כל המכשירים שלך." />
    <meta property="og:image" content="https://ma-way.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MaWay — מצא את הדרך שלך" />
    <meta name="twitter:description" content="מסלולי ריצה ישרים ורציפים — שמירה וסנכרון בין כל המכשירים שלך." />
    <meta name="twitter:image" content="https://ma-way.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Rubik:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Launch splash: plain HTML + inline CSS so it paints instantly, before
         the JS bundle (and its fonts/data) have loaded — covers the blank-page
         gap on a cold PWA launch. Removed by main.jsx once React has mounted.
         Kept in sync by hand with the brand tokens in src/index.css. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 80% at 50% 0%, #ffffff 0%, #e9f6ef 70%, #dff0e8 100%);
        transition: opacity 0.3s ease;
      }
      #app-splash img {
        width: 88px;
        height: auto;
        animation: app-splash-breathe 1.8s ease-in-out infinite;
      }
      #app-splash span {
        font-family: 'Quicksand', 'Rubik', sans-serif;
        font-weight: 600;
        font-size: 20px;
        color: #4a5a6b;
      }
      #app-splash .app-splash-dots {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      #app-splash .app-splash-dots i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3e9b76;
        animation: app-splash-dot 1.2s ease-in-out infinite;
      }
      #app-splash .app-splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #app-splash .app-splash-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes app-splash-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes app-splash-dot {
        0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-3px); }
      }
      /* Respect the in-app a11y toggle (set before paint, see the script above)
         and the OS-level preference for first-time visitors. */
      .a11y-reduce-motion #app-splash img,
      .a11y-reduce-motion #app-splash .app-splash-dots i {
        animation: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash img,
        #app-splash .app-splash-dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <script>
      // Apply stored language before React mounts to avoid a direction flash.
      try {
        var l = localStorage.getItem('maway:lang');
        if (l === 'he') {
          document.documentElement.lang = 'he';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
    <div id="app-splash" aria-hidden="true">
      <img src="/maway-logo.png" alt="" />
      <span>MaWay</span>
      <div class="app-splash-dots"><i></i><i></i><i></i></div>
    </div>
    <script>
      window.__splashStart = Date.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
